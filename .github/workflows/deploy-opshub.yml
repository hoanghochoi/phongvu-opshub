name: Deploy OpsHub

on:
  push:
    branches:
      - main
      - help-content
  workflow_dispatch:
    inputs:
      skip_client_build:
        description: Deploy only the /download and /help static pages plus latest manifest from live artifacts.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: opshub-production-deploy
  cancel-in-progress: false

env:
  OPSHUB_PUBLIC_BASE_URL: https://opshub.hoanghochoi.com
  OPSHUB_API_BASE_URL: https://opshub.hoanghochoi.com/api
  OPSHUB_REMOTE_APP_DIR: /home/ubuntu/phongvu-opshub
  OPSHUB_ENV_FILE: /srv/opshub/env
  OPSHUB_HELP_CONTENT_BRANCH: help-content

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      windows_build_name: ${{ steps.version.outputs.windows_build_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      apk_name: ${{ steps.version.outputs.apk_name }}
      windows_zip_name: ${{ steps.version.outputs.windows_zip_name }}
      windows_installer_basename: ${{ steps.version.outputs.windows_installer_basename }}
      windows_installer_name: ${{ steps.version.outputs.windows_installer_name }}
      windows_checksum_name: ${{ steps.version.outputs.windows_checksum_name }}
      release_notes: ${{ steps.version.outputs.release_notes }}
    steps:
      - name: Compute release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}"
          windows_build_name="$(date -u +%Y).$(date -u +%-m).$(date -u +%-d)"
          version_code="$((100000 + GITHUB_RUN_NUMBER))"
          apk_name="phongvu-opshub-v${version_name}+${version_code}.apk"
          windows_zip_name="phongvu-opshub-windows-v${version_name}+${version_code}.zip"
          windows_installer_basename="phongvu-opshub-windows-setup-v${version_name}+${version_code}"
          windows_installer_name="${windows_installer_basename}.exe"
          release_notes="GitHub ${GITHUB_SHA::7}"
          echo "version_name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "windows_build_name=${windows_build_name}" >> "$GITHUB_OUTPUT"
          echo "version_code=${version_code}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${apk_name}" >> "$GITHUB_OUTPUT"
          echo "windows_zip_name=${windows_zip_name}" >> "$GITHUB_OUTPUT"
          echo "windows_installer_basename=${windows_installer_basename}" >> "$GITHUB_OUTPUT"
          echo "windows_installer_name=${windows_installer_name}" >> "$GITHUB_OUTPUT"
          echo "release_notes=${release_notes}" >> "$GITHUB_OUTPUT"
          windows_checksum_name=phongvu-opshub-windows-v${version_name}+${version_code}.sha256
          echo windows_checksum_name=${windows_checksum_name} >> $GITHUB_OUTPUT

  build_android:
    runs-on: ubuntu-latest
    needs: prepare
    if: ${{ github.ref != 'refs/heads/help-content' && (github.event_name != 'workflow_dispatch' || inputs.skip_client_build != true) }}
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          lfs: true

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Prepare Android SDK and JDK
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.1.0" >/dev/null

      - name: Configure Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is required for upgrade-safe release APK signing." >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Build release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "$key secret is required for upgrade-safe release APK signing." >&2
              exit 1
            fi
          done
          node scripts/prepare-task-toolchain.mjs --profile flutter --force
          flutter build apk --release --no-pub \
            --flavor production \
            --build-name "${{ needs.prepare.outputs.version_name }}" \
            --build-number "${{ needs.prepare.outputs.version_code }}" \
            --dart-define "API_BASE_URL=${OPSHUB_API_BASE_URL}"

      - name: Connect Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.OPSHUB_VPS_HOST }}
          version: latest

      - name: Configure SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.OPSHUB_VPS_HOST }}
          VPS_PORT: ${{ secrets.OPSHUB_VPS_PORT || '22' }}
          VPS_USER: ${{ secrets.OPSHUB_VPS_USER || 'ubuntu' }}
          VPS_SSH_KEY: ${{ secrets.OPSHUB_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/opshub_deploy_key
          chmod 600 ~/.ssh/opshub_deploy_key
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts
          {
            echo "Host opshub-vps"
            echo "  HostName $VPS_HOST"
            echo "  Port $VPS_PORT"
            echo "  User $VPS_USER"
            echo "  IdentityFile ~/.ssh/opshub_deploy_key"
            echo "  IdentitiesOnly yes"
          } >> ~/.ssh/config

      - name: Upload APK to VPS staging
        shell: bash
        run: |
          set -euo pipefail
          # Keep client artifacts under the run id only. A GitHub Actions rerun
          # reuses the build job's uploaded files while incrementing
          # GITHUB_RUN_ATTEMPT in the deploy job.
          staging_dir="${OPSHUB_REMOTE_APP_DIR}/action-staging/${GITHUB_RUN_ID}/android"
          ssh opshub-vps "mkdir -p '$staging_dir'"
          scp 'build/app/outputs/flutter-apk/app-production-release.apk' \
            "opshub-vps:${staging_dir}/${{ needs.prepare.outputs.apk_name }}"

  build_windows:
    runs-on: windows-latest
    needs: prepare
    if: ${{ github.ref != 'refs/heads/help-content' && (github.event_name != 'workflow_dispatch' || inputs.skip_client_build != true) }}
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          lfs: true

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Validate local payment audio source presets
        shell: pwsh
        run: python scripts/verify_payment_audio_assets.py --presets-root windows/assets/payment_audio/local_preset_speaker_v1

      - name: Build Windows release
        shell: pwsh
        run: |
          node scripts/prepare-task-toolchain.mjs --profile flutter --force
          flutter build windows --release --no-pub `
            --build-name "${{ needs.prepare.outputs.windows_build_name }}" `
            --build-number "${{ needs.prepare.outputs.version_code }}" `
            --dart-define "API_BASE_URL=${env:OPSHUB_API_BASE_URL}"

      - name: Validate local payment audio release presets
        shell: pwsh
        run: python scripts/verify_payment_audio_assets.py --presets-root build/windows/x64/runner/Release/data/payment_audio/local_preset_speaker_v1

      - name: Configure Windows internal signing certificate
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          WINDOWS_UPDATE_SIGNER_SHA256: ${{ vars.WINDOWS_UPDATE_SIGNER_SHA256 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_BASE64)) {
            throw 'WINDOWS_SIGNING_PFX_BASE64 is required; unsigned Windows release artifacts are forbidden.'
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_PASSWORD)) {
            throw 'WINDOWS_SIGNING_PFX_PASSWORD is required when WINDOWS_SIGNING_PFX_BASE64 is configured.'
          }
          $certPath = Join-Path $env:RUNNER_TEMP 'opshub-windows-signing.pfx'
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
          $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $certPath,
            $env:WINDOWS_SIGNING_PFX_PASSWORD,
            [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          )
          try {
            $algorithm = [System.Security.Cryptography.HashAlgorithmName]::SHA256
            $actualPin = $cert.GetCertHashString($algorithm).ToUpperInvariant()
            $trustedPins = @($env:WINDOWS_UPDATE_SIGNER_SHA256 -split '[,;\s]+' | ForEach-Object { $_.ToUpperInvariant() } | Where-Object { $_ })
            if ($actualPin -notin $trustedPins) {
              throw 'Windows signing certificate does not match WINDOWS_UPDATE_SIGNER_SHA256.'
            }
          } finally {
            $cert.Dispose()
          }
          'WINDOWS_SIGNING_ENABLED=true' | Out-File -FilePath $env:GITHUB_ENV -Append
          "WINDOWS_SIGNING_PFX_PATH=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WINDOWS_UPDATE_SIGNER_SHA256=$env:WINDOWS_UPDATE_SIGNER_SHA256" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Sign Windows app executable
        if: env.WINDOWS_SIGNING_ENABLED == 'true'
        timeout-minutes: 6
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          .\scripts\sign-windows-artifact.ps1 -Path 'build\windows\x64\runner\Release\phongvu_opshub.exe'

      - name: Zip Windows release
        shell: pwsh
        run: |
          $zipPath = Join-Path "build\windows\x64\runner" "${{ needs.prepare.outputs.windows_zip_name }}"
          Compress-Archive `
            -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath $zipPath `
            -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Download Visual C++ Redistributable
        shell: pwsh
        run: |
          $prereqDir = New-Item -ItemType Directory -Force -Path "build\windows\prereqs"
          $vcRedistPath = Join-Path $prereqDir.FullName "vc_redist.x64.exe"
          $downloadUrl = "https://aka.ms/vc14/vc_redist.x64.exe"
          $maxAttempts = 5
          $downloaded = $false

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              if (Test-Path $vcRedistPath) {
                Remove-Item -LiteralPath $vcRedistPath -Force
              }
              Invoke-WebRequest `
                -Uri $downloadUrl `
                -OutFile $vcRedistPath `
                -MaximumRetryCount 3 `
                -RetryIntervalSec 2

              $vcRedist = Get-Item $vcRedistPath
              if ($vcRedist.Length -lt 1000000) {
                throw "Downloaded Visual C++ Redistributable is unexpectedly small: $($vcRedist.Length) bytes"
              }

              $signature = Get-AuthenticodeSignature $vcRedistPath
              if ($signature.Status -ne "Valid") {
                throw "Visual C++ Redistributable signature is not valid: $($signature.Status)"
              }

              "VC_REDIST_X64_PATH=$($vcRedist.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
              $downloaded = $true
              break
            } catch {
              if ($attempt -eq $maxAttempts) {
                throw
              }
              Write-Warning ("Attempt {0}/{1} to download Visual C++ Redistributable failed: {2}" -f $attempt, $maxAttempts, $_.Exception.Message)
              Start-Sleep -Seconds ([Math]::Min(30, $attempt * 5))
            }
          }

          if (-not $downloaded) {
            throw "Failed to download Visual C++ Redistributable after $maxAttempts attempts."
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "iscc"
          }
          $releaseDir = (Resolve-Path "build\windows\x64\runner\Release").Path
          $outputDir = (Resolve-Path "build\windows\x64\runner").Path
          $isccArgs = @(
            "/DAppVersion=${{ needs.prepare.outputs.version_name }}",
            "/DSourceDir=$releaseDir",
            "/DVcRedistPath=${env:VC_REDIST_X64_PATH}",
            "/DOutputDir=$outputDir",
            "/DOutputBaseFilename=${{ needs.prepare.outputs.windows_installer_basename }}"
          )
          $isccArgs += 'deploy\windows\phongvu-opshub.iss'
          & $iscc @isccArgs

      - name: Sign Windows installer
        if: env.WINDOWS_SIGNING_ENABLED == 'true'
        timeout-minutes: 6
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          .\scripts\sign-windows-artifact.ps1 -Path 'build\windows\x64\runner\${{ needs.prepare.outputs.windows_installer_name }}'

      - name: Scan final Windows artifacts with Microsoft Defender
        shell: pwsh
        run: |
          .\scripts\scan-windows-artifact-defender.ps1 -Path @(
            'build\windows\x64\runner\${{ needs.prepare.outputs.windows_zip_name }}',
            'build\windows\x64\runner\${{ needs.prepare.outputs.windows_installer_name }}'
          )

      - name: Write Windows checksums
        shell: pwsh
        run: |
          $runnerDir = 'build\windows\x64\runner'
          $checksumPath = Join-Path $runnerDir '${{ needs.prepare.outputs.windows_checksum_name }}'
          $files = @(
            '${{ needs.prepare.outputs.windows_zip_name }}',
            '${{ needs.prepare.outputs.windows_installer_name }}'
          )
          $lines = foreach ($file in $files) {
            $path = Join-Path $runnerDir $file
            if (-not (Test-Path $path)) {
              throw ('Missing Windows artifact for checksum: {0}' -f $file)
            }
            $hash = (Get-FileHash -Algorithm SHA256 -Path $path).Hash.ToLowerInvariant()
            '{0}  {1}' -f $hash, $file
          }
          Set-Content -Path $checksumPath -Value $lines -Encoding ascii

      - name: Connect Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.OPSHUB_VPS_HOST }}
          version: latest

      - name: Configure SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.OPSHUB_VPS_HOST }}
          VPS_PORT: ${{ secrets.OPSHUB_VPS_PORT || '22' }}
          VPS_USER: ${{ secrets.OPSHUB_VPS_USER || 'ubuntu' }}
          VPS_SSH_KEY: ${{ secrets.OPSHUB_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/opshub_deploy_key
          chmod 600 ~/.ssh/opshub_deploy_key
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts
          {
            echo "Host opshub-vps"
            echo "  HostName $VPS_HOST"
            echo "  Port $VPS_PORT"
            echo "  User $VPS_USER"
            echo "  IdentityFile ~/.ssh/opshub_deploy_key"
            echo "  IdentitiesOnly yes"
          } >> ~/.ssh/config

      - name: Upload Windows artifacts to VPS staging
        shell: bash
        run: |
          set -euo pipefail
          # Keep client artifacts under the run id only. A GitHub Actions rerun
          # reuses the build job's uploaded files while incrementing
          # GITHUB_RUN_ATTEMPT in the deploy job.
          staging_dir="${OPSHUB_REMOTE_APP_DIR}/action-staging/${GITHUB_RUN_ID}/windows"
          ssh opshub-vps "mkdir -p '$staging_dir'"
          scp \
            'build/windows/x64/runner/${{ needs.prepare.outputs.windows_zip_name }}' \
            'build/windows/x64/runner/${{ needs.prepare.outputs.windows_installer_name }}' \
            'build/windows/x64/runner/${{ needs.prepare.outputs.windows_checksum_name }}' \
            "opshub-vps:${staging_dir}/"

  deploy:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build_android
      - build_windows
    if: ${{ github.ref != 'refs/heads/help-content' && (github.event_name != 'workflow_dispatch' || inputs.skip_client_build != true) }}
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Build production web app
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-task-toolchain.mjs --profile flutter --force
          flutter build web --release --no-pub \
            --no-web-resources-cdn \
            --build-name "${{ needs.prepare.outputs.version_name }}" \
            --build-number "${{ needs.prepare.outputs.version_code }}" \
            --dart-define "API_BASE_URL=${OPSHUB_API_BASE_URL}"
          WEB_CACHE_BUST_TOKEN="${GITHUB_SHA}" node scripts/patch-flutter-web-cache-busting.mjs

      - name: Connect Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.OPSHUB_VPS_HOST }}
          version: latest

      - name: Configure SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.OPSHUB_VPS_HOST }}
          VPS_PORT: ${{ secrets.OPSHUB_VPS_PORT || '22' }}
          VPS_USER: ${{ secrets.OPSHUB_VPS_USER || 'ubuntu' }}
          VPS_SSH_KEY: ${{ secrets.OPSHUB_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/opshub_deploy_key
          chmod 600 ~/.ssh/opshub_deploy_key
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts
          {
            echo "Host opshub-vps"
            echo "  HostName $VPS_HOST"
            echo "  Port $VPS_PORT"
            echo "  User $VPS_USER"
            echo "  IdentityFile ~/.ssh/opshub_deploy_key"
            echo "  IdentitiesOnly yes"
          } >> ~/.ssh/config

      - name: Verify staged client artifacts
        shell: bash
        run: |
          set -euo pipefail
          client_staging_dir="${OPSHUB_REMOTE_APP_DIR}/action-staging/${GITHUB_RUN_ID}"
          ssh opshub-vps \
            "CLIENT_STAGING_DIR='$client_staging_dir' \
             APK_NAME='${{ needs.prepare.outputs.apk_name }}' \
             WINDOWS_ZIP_NAME='${{ needs.prepare.outputs.windows_zip_name }}' \
             WINDOWS_INSTALLER_NAME='${{ needs.prepare.outputs.windows_installer_name }}' \
             WINDOWS_CHECKSUM_NAME='${{ needs.prepare.outputs.windows_checksum_name }}' \
             bash -s" <<'REMOTE'
          set -euo pipefail

          android_artifact="$CLIENT_STAGING_DIR/android/$APK_NAME"
          windows_zip="$CLIENT_STAGING_DIR/windows/$WINDOWS_ZIP_NAME"
          windows_installer="$CLIENT_STAGING_DIR/windows/$WINDOWS_INSTALLER_NAME"
          windows_checksum="$CLIENT_STAGING_DIR/windows/$WINDOWS_CHECKSUM_NAME"

          for file in "$android_artifact" "$windows_zip" "$windows_installer" "$windows_checksum"; do
            if [ ! -s "$file" ]; then
              echo "Missing staged client artifact: $file" >&2
              exit 1
            fi
          done

          REMOTE

      - name: Write download manifest
        shell: bash
        env:
          DOWNLOAD_MANIFEST_OUTPUT: dist/downloads/latest.json
          APP_VERSION: ${{ needs.prepare.outputs.version_name }}
          APP_BUILD_NUMBER: ${{ needs.prepare.outputs.version_code }}
          APP_RELEASE_NOTES: ${{ needs.prepare.outputs.release_notes }}
          APK_FILE_NAME: ${{ needs.prepare.outputs.apk_name }}
          WINDOWS_INSTALLER_FILE_NAME: ${{ needs.prepare.outputs.windows_installer_name }}
          WINDOWS_ZIP_FILE_NAME: ${{ needs.prepare.outputs.windows_zip_name }}
          WINDOWS_CHECKSUM_FILE_NAME: ${{ needs.prepare.outputs.windows_checksum_name }}
        run: |
          set -euo pipefail
          client_staging_dir="${OPSHUB_REMOTE_APP_DIR}/action-staging/${GITHUB_RUN_ID}"
          APK_FILE_SIZE_BYTES="$(ssh opshub-vps "stat -c%s '$client_staging_dir/android/${{ needs.prepare.outputs.apk_name }}'")"
          WINDOWS_INSTALLER_FILE_SIZE_BYTES="$(ssh opshub-vps "stat -c%s '$client_staging_dir/windows/${{ needs.prepare.outputs.windows_installer_name }}'")"
          WINDOWS_ZIP_FILE_SIZE_BYTES="$(ssh opshub-vps "stat -c%s '$client_staging_dir/windows/${{ needs.prepare.outputs.windows_zip_name }}'")"
          WINDOWS_CHECKSUM_FILE_SIZE_BYTES="$(ssh opshub-vps "stat -c%s '$client_staging_dir/windows/${{ needs.prepare.outputs.windows_checksum_name }}'")"
          export \
            APK_FILE_SIZE_BYTES \
            WINDOWS_INSTALLER_FILE_SIZE_BYTES \
            WINDOWS_ZIP_FILE_SIZE_BYTES \
            WINDOWS_CHECKSUM_FILE_SIZE_BYTES
          node scripts/download-manifest.mjs from-published

      - name: Upload app bundle and download metadata
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$OPSHUB_HELP_CONTENT_BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$OPSHUB_HELP_CONTENT_BRANCH"
            rm -rf docs/help
            git checkout FETCH_HEAD -- docs/help
            echo "Loaded docs/help from origin/${OPSHUB_HELP_CONTENT_BRANCH}."
          else
            echo "origin/${OPSHUB_HELP_CONTENT_BRANCH} not found; using docs/help from ${GITHUB_REF_NAME}."
          fi
          node scripts/build-runtime-release.mjs
          tar -C docs/help -czf dist/help-assets.tar.gz assets
          tar -C build/web -czf dist/web.tar.gz .
          remote_release_dir="${OPSHUB_REMOTE_APP_DIR}/releases/${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tmp_dir="${OPSHUB_REMOTE_APP_DIR}/tmp/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh opshub-vps "mkdir -p '$remote_release_dir' '$tmp_dir'"
          rsync -az --delete 'dist/runtime-release/' \
            "opshub-vps:${remote_release_dir}/"
          scp 'dist/downloads/latest.json' 'deploy/home-server/download.html' \
            'dist/help-assets.tar.gz' 'dist/web.tar.gz' "opshub-vps:${tmp_dir}/"
          scp 'web/icons/Icon-192.png' \
            "opshub-vps:${tmp_dir}/opshub-icon-192.png"

      - name: Deploy backend and publish version metadata
        id: deploy_runtime
        shell: bash
        run: |
          set -euo pipefail
          remote_release_dir="${OPSHUB_REMOTE_APP_DIR}/releases/${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          client_staging_dir="${OPSHUB_REMOTE_APP_DIR}/action-staging/${GITHUB_RUN_ID}"
          tmp_dir="${OPSHUB_REMOTE_APP_DIR}/tmp/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          android_update_url="${OPSHUB_PUBLIC_BASE_URL}/downloads/${{ needs.prepare.outputs.apk_name }}"
          windows_update_url="${OPSHUB_PUBLIC_BASE_URL}/downloads/${{ needs.prepare.outputs.windows_installer_name }}"
          android_package_sha256="$(ssh opshub-vps "sha256sum '$client_staging_dir/android/${{ needs.prepare.outputs.apk_name }}' | awk '{print \$1}'")"
          windows_package_sha256="$(ssh opshub-vps "sha256sum '$client_staging_dir/windows/${{ needs.prepare.outputs.windows_installer_name }}' | awk '{print \$1}'")"
          android_package_size_bytes="$(ssh opshub-vps "stat -c%s '$client_staging_dir/android/${{ needs.prepare.outputs.apk_name }}'")"
          windows_package_size_bytes="$(ssh opshub-vps "stat -c%s '$client_staging_dir/windows/${{ needs.prepare.outputs.windows_installer_name }}'")"
          windows_installer_args="/VERYSILENT,/SUPPRESSMSGBOXES,/NORESTART,/CLOSEAPPLICATIONS,/OPSHUBRELAUNCH=1"
          ssh opshub-vps \
            "REMOTE_RELEASE_DIR='$remote_release_dir' \
             CLIENT_STAGING_DIR='$client_staging_dir' \
             TMP_DIR='$tmp_dir' \
             OPSHUB_REMOTE_APP_DIR='${OPSHUB_REMOTE_APP_DIR}' \
             DEPLOY_RUN_ID='$GITHUB_RUN_ID' \
             DEPLOY_RUN_ATTEMPT='$GITHUB_RUN_ATTEMPT' \
             CURRENT_DIR='${OPSHUB_REMOTE_APP_DIR}/current' \
             OPSHUB_ENV_FILE='$OPSHUB_ENV_FILE' \
             OPSHUB_SSD_ROOT='/srv/opshub' \
             DOWNLOADS_DIR='/srv/opshub/downloads' \
             WEB_DIR='/srv/opshub/web' \
             APK_NAME='${{ needs.prepare.outputs.apk_name }}' \
             WINDOWS_ZIP_NAME='${{ needs.prepare.outputs.windows_zip_name }}' \
             WINDOWS_INSTALLER_NAME='${{ needs.prepare.outputs.windows_installer_name }}' \
             WINDOWS_CHECKSUM_NAME='${{ needs.prepare.outputs.windows_checksum_name }}' \
             APP_VERSION='${{ needs.prepare.outputs.version_name }}' \
             APP_BUILD_NUMBER='${{ needs.prepare.outputs.version_code }}' \
             ANDROID_UPDATE_URL='$android_update_url' \
             WINDOWS_UPDATE_URL='$windows_update_url' \
             ANDROID_PACKAGE_SHA256='$android_package_sha256' \
             WINDOWS_PACKAGE_SHA256='$windows_package_sha256' \
             ANDROID_PACKAGE_SIZE_BYTES='$android_package_size_bytes' \
             WINDOWS_PACKAGE_SIZE_BYTES='$windows_package_size_bytes' \
             WINDOWS_INSTALLER_ARGS='$windows_installer_args' \
             APP_RELEASE_NOTES='${{ needs.prepare.outputs.release_notes }}' \
             bash -s" <<'REMOTE'
          set -Eeuo pipefail

          source "$REMOTE_RELEASE_DIR/deploy/home-server/release-transaction.sh"
          export OPSHUB_SUDO=sudo
          TXN_INPUT_DIR="$TMP_DIR"
          TXN_CLIENT_DIR="$CLIENT_STAGING_DIR"

          sudo mkdir -p "$(dirname "$OPSHUB_ENV_FILE")"
          if [ ! -s "$OPSHUB_ENV_FILE" ]; then
            echo "Missing non-empty production env file: $OPSHUB_ENV_FILE" >&2
            exit 1
          fi
          opshub_txn_begin
          previous_current="$(opshub_txn_previous_release)"

          compose_cmd() {
             "${compose[@]}" "$@" < /dev/null
          }

          dump_deploy_diagnostics() {
             set +e
             if declare -F compose_cmd >/dev/null 2>&1 && declare -p compose >/dev/null 2>&1; then
               echo "::group::Docker deployment diagnostics"
               compose_cmd ps
               compose_cmd logs --tail=200 api
               compose_cmd logs --tail=120 realtime
               compose_cmd logs --tail=120 caddy
               docker inspect home-server-api-1 --format '{{json .State.Health}}'
               echo "::endgroup::"
             else
               echo 'Docker diagnostics unavailable before Compose initialization.' >&2
             fi
             set -e
          }

          rollback_to_release() {
             local candidate="$1"
             if [ ! -d "$candidate" ]; then
               return 1
             fi
             echo "Attempting rollback to release: $candidate"
             ln -sfn "$candidate" "${CURRENT_DIR}.rollback"
             mv -Tf "${CURRENT_DIR}.rollback" "$CURRENT_DIR"
             cd "$CURRENT_DIR"
             export OPSHUB_ENV_FILE
             compose=(docker compose --env-file "$OPSHUB_ENV_FILE" -f deploy/home-server/docker-compose.home.yml)
             if compose_cmd up -d --build --force-recreate --wait --wait-timeout 240 redis api realtime caddy; then
               echo "Rollback release is healthy: $candidate"
               compose_cmd ps
               return 0
             fi
             dump_deploy_diagnostics
             return 1
          }

          rollback_on_error() {
             local status="$1"
             local env_restored=false
             local shared_restored=false
             trap - ERR
             echo "Deploy failed with status $status" >&2
             dump_deploy_diagnostics
             if opshub_txn_restore_env; then
               env_restored=true
             else
               echo "Production env restore failed; rollback evidence retained." >&2
             fi
             if opshub_txn_restore_shared; then
               shared_restored=true
             else
               echo "Production shared publication restore failed; rollback evidence retained." >&2
             fi
             if [ "$env_restored" != true ]; then
               echo "Exact runtime rollback is unsafe without the previous env; manual recovery required." >&2
               exit "$status"
             fi
             if rollback_to_release "$previous_current"; then
               if [ "$shared_restored" = true ]; then
                 echo "Rollback is healthy; checkpoint retained because the release failed." >&2
               else
                 echo "Runtime is healthy but shared publication recovery remains incomplete." >&2
               fi
               exit "$status"
             fi
             echo "Exact previous release rollback did not become healthy; evidence retained." >&2
             exit "$status"
          }

          run_compose_or_rollback() {
             local status
             if compose_cmd "$@"; then
               return 0
             else
               status=$?
             fi
             rollback_on_error "$status"
          }
          trap 'rollback_on_error $?' ERR

          sudo chown root:"$(id -gn)" "$OPSHUB_ENV_FILE"
          sudo chmod 640 "$OPSHUB_ENV_FILE"

          required_runtime_env_keys=(
            POSTGRES_USER
            POSTGRES_PASSWORD
            POSTGRES_DB
            DATABASE_URL
            JWT_SECRET
            OPSHUB_DOMAIN
            OPSHUB_HTTP_BIND
            OPSHUB_RUNTIME_UID
            OPSHUB_RUNTIME_GID
            REDIS_PASSWORD
            BACKUP_AGE_RECIPIENT
            UPLOAD_BASE_DIR
            IMAGE_BASE_URL
            PRIVATE_MEDIA_BASE_DIR
            PRIVATE_MEDIA_PUBLIC_BASE_URL
          )
          for key in "${required_runtime_env_keys[@]}"; do
            value="$(sudo sed -n "s/^${key}=//p" "$OPSHUB_ENV_FILE" | head -n 1)"
            if [ -z "$value" ]; then
              echo "Missing required production env key: $key" >&2
              exit 1
            fi
          done

          runtime_uid="$(sudo sed -n 's/^OPSHUB_RUNTIME_UID=//p' "$OPSHUB_ENV_FILE" | head -n 1)"
          runtime_gid="$(sudo sed -n 's/^OPSHUB_RUNTIME_GID=//p' "$OPSHUB_ENV_FILE" | head -n 1)"
          redis_password="$(sudo sed -n 's/^REDIS_PASSWORD=//p' "$OPSHUB_ENV_FILE" | head -n 1)"
          if ! [[ "$runtime_uid" =~ ^[1-9][0-9]*$ && "$runtime_gid" =~ ^[1-9][0-9]*$ ]]; then
            echo 'OPSHUB_RUNTIME_UID/GID must be non-root numeric IDs.' >&2
            exit 1
          fi
          if [ "${#redis_password}" -lt 32 ]; then
            echo 'REDIS_PASSWORD must contain at least 32 characters.' >&2
            exit 1
          fi
          unset redis_password

          sudo install -d -o "$runtime_uid" -g "$runtime_gid" -m 0770 \
            /srv/opshub/uploads \
            /srv/opshub/private-media \
            /srv/opshub/payment-audio \
            /srv/opshub/caddy/data \
            /srv/opshub/caddy/config

          upsert_env() {
            key="$1"
            value="$2"
            escaped_value=$(printf '%s' "$value" | sed 's/[\/&]/\\&/g')
            if sudo grep -q "^${key}=" "$OPSHUB_ENV_FILE"; then
              sudo sed -i "s/^${key}=.*/${key}=${escaped_value}/" "$OPSHUB_ENV_FILE"
            else
              printf '%s=%s\n' "$key" "$value" | sudo tee -a "$OPSHUB_ENV_FILE" >/dev/null
            fi
          }

          contact_grace_until=$(sudo grep '^SALES_REPORT_FOLLOW_UP_CONTACT_GRACE_UNTIL=' "$OPSHUB_ENV_FILE" | tail -n 1 | cut -d= -f2- || true)
          if [ -z "$contact_grace_until" ]; then
            contact_grace_until=$(date -u -d '+14 days' '+%Y-%m-%dT%H:%M:%SZ')
            upsert_env SALES_REPORT_FOLLOW_UP_CONTACT_GRACE_UNTIL "$contact_grace_until"
          fi
          echo "Follow-up contact grace ends at $contact_grace_until"

          upsert_env APP_VERSION "$APP_VERSION"
          upsert_env BIDV_H2H_DOMAIN "bankapis.hoanghochoi.com"
          upsert_env BIDV_H2H_PUBLIC_BASE_URL "https://bankapis.hoanghochoi.com"
          upsert_env BIDV_H2H_ENVIRONMENT production
          if ! sudo grep -q '^BIDV_H2H_INGEST_ENABLED=' "$OPSHUB_ENV_FILE"; then
            upsert_env BIDV_H2H_INGEST_ENABLED false
          fi
          if ! sudo grep -q '^BIDV_H2H_PROJECTION_ENABLED=' "$OPSHUB_ENV_FILE"; then
            upsert_env BIDV_H2H_PROJECTION_ENABLED false
          fi
          upsert_env APP_BUILD_NUMBER "$APP_BUILD_NUMBER"
          upsert_env APP_MIN_SUPPORTED_BUILD "$APP_BUILD_NUMBER"
          upsert_env APP_UPDATE_URL "$ANDROID_UPDATE_URL"
          upsert_env APP_PACKAGE_URL "$ANDROID_UPDATE_URL"
          upsert_env APP_PACKAGE_SHA256 "$ANDROID_PACKAGE_SHA256"
          upsert_env APP_PACKAGE_SIZE_BYTES "$ANDROID_PACKAGE_SIZE_BYTES"
          upsert_env APP_PACKAGE_TYPE apk
          upsert_env APP_RELEASE_NOTES "$APP_RELEASE_NOTES"
          upsert_env APP_FORCE_UPDATE true

          upsert_env APP_ANDROID_APP_VERSION "$APP_VERSION"
          upsert_env APP_ANDROID_APP_BUILD_NUMBER "$APP_BUILD_NUMBER"
          upsert_env APP_ANDROID_APP_MIN_SUPPORTED_BUILD "$APP_BUILD_NUMBER"
          upsert_env APP_ANDROID_APP_UPDATE_URL "$ANDROID_UPDATE_URL"
          upsert_env APP_ANDROID_APP_PACKAGE_URL "$ANDROID_UPDATE_URL"
          upsert_env APP_ANDROID_APP_PACKAGE_SHA256 "$ANDROID_PACKAGE_SHA256"
          upsert_env APP_ANDROID_APP_PACKAGE_SIZE_BYTES "$ANDROID_PACKAGE_SIZE_BYTES"
          upsert_env APP_ANDROID_APP_PACKAGE_TYPE apk
          upsert_env APP_ANDROID_APP_RELEASE_NOTES "$APP_RELEASE_NOTES"
          upsert_env APP_ANDROID_APP_FORCE_UPDATE true

          upsert_env APP_WINDOWS_APP_VERSION "$APP_VERSION"
          upsert_env APP_WINDOWS_APP_BUILD_NUMBER "$APP_BUILD_NUMBER"
          upsert_env APP_WINDOWS_APP_MIN_SUPPORTED_BUILD "$APP_BUILD_NUMBER"
          upsert_env APP_WINDOWS_APP_UPDATE_URL "$WINDOWS_UPDATE_URL"
          upsert_env APP_WINDOWS_APP_PACKAGE_URL "$WINDOWS_UPDATE_URL"
          upsert_env APP_WINDOWS_APP_PACKAGE_SHA256 "$WINDOWS_PACKAGE_SHA256"
          upsert_env APP_WINDOWS_APP_PACKAGE_SIZE_BYTES "$WINDOWS_PACKAGE_SIZE_BYTES"
          upsert_env APP_WINDOWS_APP_PACKAGE_TYPE windowsInstaller
          upsert_env APP_WINDOWS_APP_INSTALLER_ARGS "$WINDOWS_INSTALLER_ARGS"
          upsert_env APP_WINDOWS_APP_RELEASE_NOTES "$APP_RELEASE_NOTES"
          upsert_env APP_WINDOWS_APP_FORCE_UPDATE true

          upsert_env APP_WEB_APP_VERSION "$APP_VERSION"
          upsert_env APP_WEB_APP_BUILD_NUMBER "$APP_BUILD_NUMBER"
          upsert_env APP_WEB_APP_MIN_SUPPORTED_BUILD 1
          upsert_env APP_WEB_APP_UPDATE_URL ""
          upsert_env APP_WEB_APP_RELEASE_NOTES "$APP_RELEASE_NOTES"
          upsert_env APP_WEB_APP_FORCE_UPDATE false

          docker run --rm \
            --env-file "$OPSHUB_ENV_FILE" \
            -v "$REMOTE_RELEASE_DIR/deploy/home-server/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile < /dev/null

          # Publish client/static inputs only after env and Caddy validation,
          # while keeping the complete rollback checkpoint alive.
          opshub_txn_stage_shared
          ln -sfn "$REMOTE_RELEASE_DIR" "${CURRENT_DIR}.next"
          mv -Tf "${CURRENT_DIR}.next" "$CURRENT_DIR"
          cd "$CURRENT_DIR"
          export OPSHUB_ENV_FILE
          compose=(docker compose --env-file "$OPSHUB_ENV_FILE" -f deploy/home-server/docker-compose.home.yml)
          compose_cmd() {
            "${compose[@]}" "$@" < /dev/null
          }

          compose_cmd config >/dev/null

          # The first hardened production rollout enables Redis authentication.
          # Recreate Redis in the same guarded maintenance transaction so API and
          # realtime never start with credentials that the running Redis ignores.
          compose_cmd stop api realtime caddy || true
          run_compose_or_rollback up -d --force-recreate --wait --wait-timeout 120 redis

          run_compose_or_rollback --profile migrate run --rm -T --build migrate \
            node scripts/recover-failed-prisma-migration.mjs \
              20260614130000_flatten_store_cash_org_tree

          run_compose_or_rollback --profile migrate run --rm -T --build migrate

          run_compose_or_rollback up -d --build --force-recreate --wait --wait-timeout 240 api realtime caddy

          expected_app_env="${APP_VERSION}|${APP_BUILD_NUMBER}|${APP_VERSION}|${APP_BUILD_NUMBER}|${APP_VERSION}|${APP_BUILD_NUMBER}|1|false"
          for attempt in {1..12}; do
            current_app_env="$(
              compose_cmd \
                exec -T api sh -lc \
                'printf "%s|%s|%s|%s|%s|%s|%s|%s" "$APP_ANDROID_APP_VERSION" "$APP_ANDROID_APP_BUILD_NUMBER" "$APP_WINDOWS_APP_VERSION" "$APP_WINDOWS_APP_BUILD_NUMBER" "$APP_WEB_APP_VERSION" "$APP_WEB_APP_BUILD_NUMBER" "$APP_WEB_APP_MIN_SUPPORTED_BUILD" "$APP_WEB_APP_FORCE_UPDATE"' \
                2>/dev/null || true
            )"
            if [ "$current_app_env" = "$expected_app_env" ]; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "API container app-version env mismatch after recreate: expected $expected_app_env got ${current_app_env:-<empty>}" >&2
              exit 1
            fi
            sleep 5
          done

          compose_cmd ps
          trap - ERR

          REMOTE

      - name: Verify public health and version metadata
        shell: bash
        run: |
          set -euo pipefail
          retry_curl() {
            local url="$1"
            local attempt
            for attempt in {1..12}; do
              if curl -fsS "$url"; then
                return 0
              fi
              sleep 5
            done
            curl -fsS "$url"
          }
          verify_security_headers() {
            local headers="$1"
            local header
            for header in \
              'content-security-policy:' \
              'strict-transport-security:.*max-age=31536000' \
              'x-content-type-options:.*nosniff' \
              'x-frame-options:.*sameorigin' \
              'referrer-policy:.*no-referrer' \
              'permissions-policy:'; do
              if ! printf '%s\n' "$headers" | grep -Eqi "^${header}"; then
                echo "Production response is missing required security header pattern: ${header}" >&2
                return 1
              fi
            done
            if printf '%s\n' "$headers" | grep -qi '^content-security-policy-report-only:'; then
              echo 'Production still serves a report-only CSP.' >&2
              return 1
            fi
          }

          retry_curl "${OPSHUB_PUBLIC_BASE_URL}/health"
          retry_curl "${OPSHUB_PUBLIC_BASE_URL}/" >/dev/null
          main_headers_file="$(mktemp)"
          if ! main_status="$(
            curl -sS -D "$main_headers_file" -o /dev/null -w '%{http_code}' \
              "${OPSHUB_PUBLIC_BASE_URL}/main.dart.js?v=${GITHUB_SHA}"
          )"; then
            rm -f "$main_headers_file"
            echo 'Production main.dart.js request failed before receiving an HTTP response.' >&2
            exit 1
          fi
          main_headers="$(cat "$main_headers_file")"
          rm -f "$main_headers_file"
          if [[ "$main_status" != 2* ]]; then
            echo "Production main.dart.js returned HTTP ${main_status}; expected 2xx." >&2
            exit 1
          fi
          if ! printf '%s\n' "$main_headers" | grep -qi 'cache-control:.*no-cache'; then
            echo 'Production main.dart.js is missing the required no-cache policy.' >&2
            exit 1
          fi
          verify_security_headers "$main_headers"
          android_json="$(retry_curl "${OPSHUB_API_BASE_URL}/app-version?platform=android")"
          windows_json="$(retry_curl "${OPSHUB_API_BASE_URL}/app-version?platform=windows")"
          web_json="$(retry_curl "${OPSHUB_API_BASE_URL}/app-version?platform=web")"
          node -e "
            const android = JSON.parse(process.argv[1]);
            const windows = JSON.parse(process.argv[2]);
            const web = JSON.parse(process.argv[3]);
            const expectedBuild = Number(process.argv[4]);
            if (android.latestBuild !== expectedBuild) {
              throw new Error(\`Android latestBuild expected \${expectedBuild}, got \${android.latestBuild}\`);
            }
            if (windows.latestBuild !== expectedBuild) {
              throw new Error(\`Windows latestBuild expected \${expectedBuild}, got \${windows.latestBuild}\`);
            }
            if (web.latestBuild !== expectedBuild) {
              throw new Error(\`Web latestBuild expected \${expectedBuild}, got \${web.latestBuild}\`);
            }
            if (!String(android.updateUrl || '').endsWith('.apk')) {
              throw new Error('Android updateUrl is not an APK');
            }
            if (!String(windows.updateUrl || '').endsWith('.exe')) {
              throw new Error('Windows updateUrl is not an installer EXE');
            }
            for (const [platform, payload] of Object.entries({ android, windows })) {
              if (payload.packageUrl !== payload.updateUrl) {
                throw new Error(platform + ' packageUrl must match updateUrl for self-update');
              }
              if (!/^[0-9a-f]{64}$/.test(String(payload.packageSha256 || ''))) {
                throw new Error(platform + ' packageSha256 is invalid');
              }
              if (!Number.isInteger(payload.packageSizeBytes) || payload.packageSizeBytes <= 0) {
                throw new Error(platform + ' packageSizeBytes is invalid');
              }
            }
            if (android.packageType !== 'apk') throw new Error('Android packageType must be apk');
            if (windows.packageType !== 'windowsInstaller') throw new Error('Windows packageType must be windowsInstaller');
            if (!Array.isArray(windows.installerArgs) || !windows.installerArgs.includes('/VERYSILENT')) {
              throw new Error('Windows installerArgs must include /VERYSILENT');
            }
            if (!windows.installerArgs.includes('/OPSHUBRELAUNCH=1')) {
              throw new Error('Windows installerArgs must include /OPSHUBRELAUNCH=1');
            }
            if (web.platform !== 'web') throw new Error('Web app-version did not report platform=web');
            if (String(web.updateUrl || '') !== '') throw new Error('Web updateUrl must be empty');
            if (web.forceUpdate !== false) throw new Error('Web forceUpdate must be false');
            if (web.minSupportedBuild !== 1) throw new Error('Web minSupportedBuild must be 1');
          " "$android_json" "$windows_json" "$web_json" "${{ needs.prepare.outputs.version_code }}"
          curl -fIs "$(node -e "console.log(JSON.parse(process.argv[1]).packageUrl)" "$android_json")" >/dev/null
          curl -fIs "$(node -e "console.log(JSON.parse(process.argv[1]).packageUrl)" "$windows_json")" >/dev/null
          retry_curl "${OPSHUB_PUBLIC_BASE_URL}/download" >/dev/null
          retry_curl "${OPSHUB_PUBLIC_BASE_URL}/help" >/dev/null
          help_json="$(retry_curl "${OPSHUB_API_BASE_URL}/help-content/public")"
          manifest_json="$(retry_curl "${OPSHUB_PUBLIC_BASE_URL}/downloads/latest.json")"
          node -e "
            const help = JSON.parse(process.argv[1]);
            const manifest = JSON.parse(process.argv[2]);
            const expectedVersion = process.argv[3];
            const expectedBuild = Number(process.argv[4]);
            if (!Array.isArray(help.pages) || help.pages.length === 0) {
              throw new Error('Public help runtime snapshot is empty');
            }
            if (manifest.version !== expectedVersion) {
              throw new Error('Download manifest version expected ' + expectedVersion + ', got ' + manifest.version);
            }
            if (manifest.build !== expectedBuild) {
              throw new Error('Download manifest build expected ' + expectedBuild + ', got ' + manifest.build);
            }
            const required = ['apk', 'windowsInstaller', 'windowsZip', 'windowsChecksum'];
            for (const key of required) {
              const file = manifest.files?.[key];
              if (!file?.url || !file?.fileName || !Number.isInteger(file.sizeBytes) || file.sizeBytes <= 0) {
                throw new Error('Download manifest file entry is invalid: ' + key);
              }
            }
            if (!manifest.files.apk.url.endsWith('.apk')) throw new Error('APK URL is invalid');
            if (!manifest.files.windowsInstaller.url.endsWith('.exe')) throw new Error('Windows installer URL is invalid');
            if (!manifest.files.windowsZip.url.endsWith('.zip')) throw new Error('Windows ZIP URL is invalid');
            if (!manifest.files.windowsChecksum.url.endsWith('.sha256')) throw new Error('Windows checksum URL is invalid');
          " "$help_json" "$manifest_json" "${{ needs.prepare.outputs.version_name }}" "${{ needs.prepare.outputs.version_code }}"
          node -e "
            const manifest = JSON.parse(process.argv[1]);
            for (const file of Object.values(manifest.files)) console.log(file.url);
          " "$manifest_json" | while IFS= read -r url; do
            curl -fIs "$url" >/dev/null
          done

      - name: Roll back production after failed release verification
        if: ${{ (failure() || cancelled()) && steps.deploy_runtime.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          remote_release_dir="${OPSHUB_REMOTE_APP_DIR}/releases/${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          client_staging_dir="${OPSHUB_REMOTE_APP_DIR}/action-staging/${GITHUB_RUN_ID}"
          tmp_dir="${OPSHUB_REMOTE_APP_DIR}/tmp/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh opshub-vps \
            "REMOTE_RELEASE_DIR='$remote_release_dir' \
             CURRENT_DIR='${OPSHUB_REMOTE_APP_DIR}/current' \
             CLIENT_STAGING_DIR='$client_staging_dir' \
             TMP_DIR='$tmp_dir' \
             OPSHUB_REMOTE_APP_DIR='${OPSHUB_REMOTE_APP_DIR}' \
             DEPLOY_RUN_ID='$GITHUB_RUN_ID' \
             DEPLOY_RUN_ATTEMPT='$GITHUB_RUN_ATTEMPT' \
             OPSHUB_ENV_FILE='$OPSHUB_ENV_FILE' \
             OPSHUB_SSD_ROOT='/srv/opshub' \
             DOWNLOADS_DIR='/srv/opshub/downloads' \
             WEB_DIR='/srv/opshub/web' \
             APK_NAME='${{ needs.prepare.outputs.apk_name }}' \
             WINDOWS_ZIP_NAME='${{ needs.prepare.outputs.windows_zip_name }}' \
             WINDOWS_INSTALLER_NAME='${{ needs.prepare.outputs.windows_installer_name }}' \
             WINDOWS_CHECKSUM_NAME='${{ needs.prepare.outputs.windows_checksum_name }}' \
             COMPOSE_PROJECT_NAME='opshub' \
             bash -s" <<'REMOTE'
          set -Eeuo pipefail
          source "$REMOTE_RELEASE_DIR/deploy/home-server/release-transaction.sh"
          export OPSHUB_SUDO=sudo
          txn_id="${DEPLOY_RUN_ID}-${DEPLOY_RUN_ATTEMPT}"
          if ! sudo test -s "${OPSHUB_ENV_FILE}.rollback.${txn_id}" || \
             ! sudo test -s "${OPSHUB_SSD_ROOT}/rollback/deploy-${txn_id}.state" || \
             ! sudo test -e "${OPSHUB_SSD_ROOT}/rollback/deploy-${txn_id}.shared/SNAPSHOT_READY"; then
            echo 'Protected production rollback checkpoint is missing; manual recovery required.' >&2
            exit 1
          fi
          opshub_txn_load
          opshub_txn_require_promoted
          previous_release="$(opshub_txn_previous_release)"
          current_real="$(readlink -f "$CURRENT_DIR" || true)"
          if [ "$current_real" != "$(opshub_txn_candidate_release)" ]; then
            echo 'Production rollback candidate no longer matches checkpoint; refusing runtime change.' >&2
            exit 1
          fi
          opshub_txn_restore_env
          opshub_txn_restore_shared
          ln -sfn "$previous_release" "${CURRENT_DIR}.rollback"
          mv -Tf "${CURRENT_DIR}.rollback" "$CURRENT_DIR"
          cd "$CURRENT_DIR"
          export OPSHUB_ENV_FILE COMPOSE_PROJECT_NAME
          compose=(docker compose --env-file "$OPSHUB_ENV_FILE" -f deploy/home-server/docker-compose.home.yml)
          compose_cmd() { "${compose[@]}" "$@" < /dev/null; }
          compose_cmd up -d --build --force-recreate --wait --wait-timeout 240 redis api realtime caddy
          curl -fsS -H 'Host: opshub.hoanghochoi.com' -H 'X-Forwarded-Proto: https' 'http://127.0.0.1:8090/health' >/dev/null
          echo 'Production release, env, web, Help, manifest and client files rolled back; checkpoint retained because public verification failed.' >&2
          REMOTE

      - name: Finalize successful production release checkpoint
        if: ${{ success() && steps.deploy_runtime.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          remote_release_dir="${OPSHUB_REMOTE_APP_DIR}/releases/${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          client_staging_dir="${OPSHUB_REMOTE_APP_DIR}/action-staging/${GITHUB_RUN_ID}"
          tmp_dir="${OPSHUB_REMOTE_APP_DIR}/tmp/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh opshub-vps \
            "REMOTE_RELEASE_DIR='$remote_release_dir' CURRENT_DIR='${OPSHUB_REMOTE_APP_DIR}/current' CLIENT_STAGING_DIR='$client_staging_dir' TMP_DIR='$tmp_dir' OPSHUB_REMOTE_APP_DIR='${OPSHUB_REMOTE_APP_DIR}' DEPLOY_RUN_ID='$GITHUB_RUN_ID' DEPLOY_RUN_ATTEMPT='$GITHUB_RUN_ATTEMPT' OPSHUB_ENV_FILE='$OPSHUB_ENV_FILE' OPSHUB_SSD_ROOT='/srv/opshub' DOWNLOADS_DIR='/srv/opshub/downloads' WEB_DIR='/srv/opshub/web' APK_NAME='${{ needs.prepare.outputs.apk_name }}' WINDOWS_ZIP_NAME='${{ needs.prepare.outputs.windows_zip_name }}' WINDOWS_INSTALLER_NAME='${{ needs.prepare.outputs.windows_installer_name }}' WINDOWS_CHECKSUM_NAME='${{ needs.prepare.outputs.windows_checksum_name }}' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          source "$REMOTE_RELEASE_DIR/deploy/home-server/release-transaction.sh"
          export OPSHUB_SUDO=sudo
          opshub_txn_load
          opshub_txn_require_promoted
          current_real="$(readlink -f "$CURRENT_DIR" || true)"
          candidate_real="$(opshub_txn_candidate_release)"
          [ "$current_real" = "$candidate_real" ] || { echo 'Successful release checkpoint does not match current runtime.' >&2; exit 1; }
          case "$CLIENT_STAGING_DIR" in "$OPSHUB_REMOTE_APP_DIR"/action-staging/*) rm -rf -- "$CLIENT_STAGING_DIR" ;; *) exit 1 ;; esac
          case "$TMP_DIR" in "$OPSHUB_REMOTE_APP_DIR"/tmp/*) rm -rf -- "$TMP_DIR" ;; *) exit 1 ;; esac
          releases_dir="$(dirname "$REMOTE_RELEASE_DIR")"
          mapfile -t release_dirs < <(find "$releases_dir" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -rn | awk '{print $2}')
          kept=0
          previous_real="$(opshub_txn_previous_release)"
          for dir in "${release_dirs[@]}"; do
            dir_real="$(readlink -f "$dir")"
            if [ "$dir_real" = "$current_real" ] || [ "$dir_real" = "$previous_real" ] || [ "$kept" -lt 5 ]; then kept=$((kept + 1)); continue; fi
            rm -rf -- "$dir"
          done
          mapfile -t client_files < <(find "$DOWNLOADS_DIR" -maxdepth 1 -type f \( -name 'phongvu-opshub-v*.apk' -o -name 'phongvu-opshub-windows-v*.zip' -o -name 'phongvu-opshub-windows-setup-v*.exe' -o -name 'phongvu-opshub-windows-v*.sha256' \) -printf '%T@ %p\n' | sort -rn | awk '{print $2}')
          kept=0
          for file in "${client_files[@]}"; do if [ "$kept" -lt 20 ]; then kept=$((kept + 1)); else rm -f -- "$file"; fi; done
          opshub_txn_cleanup
          echo 'Production release checkpoint finalized after public verification.'
          REMOTE

  deploy_download_static:
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.skip_client_build == true) || github.ref == 'refs/heads/help-content' }}
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Confirm static-only deploy
        shell: bash
        run: |
          set -euo pipefail
          echo 'Static-only deploy requested; Android and Windows build jobs are skipped.'

      - name: Capture live app-version metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/downloads
          curl -fsS "${OPSHUB_API_BASE_URL}/app-version?platform=android" > dist/downloads/android-before.json
          curl -fsS "${OPSHUB_API_BASE_URL}/app-version?platform=windows" > dist/downloads/windows-before.json

      - name: Write download manifest from live artifacts
        shell: bash
        env:
          DOWNLOAD_MANIFEST_OUTPUT: dist/downloads/latest.json
        run: |
          set -euo pipefail
          node scripts/download-manifest.mjs from-live

      - name: Connect Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.OPSHUB_VPS_HOST }}
          version: latest

      - name: Configure SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.OPSHUB_VPS_HOST }}
          VPS_PORT: ${{ secrets.OPSHUB_VPS_PORT || '22' }}
          VPS_USER: ${{ secrets.OPSHUB_VPS_USER || 'ubuntu' }}
          VPS_SSH_KEY: ${{ secrets.OPSHUB_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/opshub_deploy_key
          chmod 600 ~/.ssh/opshub_deploy_key
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts
          {
            echo "Host opshub-vps"
            echo "  HostName $VPS_HOST"
            echo "  Port $VPS_PORT"
            echo "  User $VPS_USER"
            echo "  IdentityFile ~/.ssh/opshub_deploy_key"
            echo "  IdentitiesOnly yes"
          } >> ~/.ssh/config

      - name: Upload download landing files and reload Caddy
        id: deploy_static
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/${OPSHUB_HELP_CONTENT_BRANCH}" ] && git ls-remote --exit-code --heads origin "$OPSHUB_HELP_CONTENT_BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$OPSHUB_HELP_CONTENT_BRANCH"
            rm -rf docs/help
            git checkout FETCH_HEAD -- docs/help
            echo "Loaded docs/help from origin/${OPSHUB_HELP_CONTENT_BRANCH}."
          fi
          tmp_dir="${OPSHUB_REMOTE_APP_DIR}/tmp/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-static"
          tar -C docs/help -czf dist/docs-help.tar.gz .
          ssh opshub-vps "mkdir -p '$tmp_dir'"
          scp 'dist/downloads/latest.json' 'deploy/home-server/download.html' \
            'deploy/home-server/Caddyfile' 'deploy/home-server/release-transaction.sh' \
            'dist/docs-help.tar.gz' \
            "opshub-vps:${tmp_dir}/"
          scp 'web/icons/Icon-192.png' \
            "opshub-vps:${tmp_dir}/opshub-icon-192.png"

          ssh opshub-vps \
            "REMOTE_RELEASE_DIR='${OPSHUB_REMOTE_APP_DIR}/current' \
             CURRENT_DIR='${OPSHUB_REMOTE_APP_DIR}/current' \
             TMP_DIR='$tmp_dir' \
             OPSHUB_REMOTE_APP_DIR='${OPSHUB_REMOTE_APP_DIR}' \
             DEPLOY_RUN_ID='$GITHUB_RUN_ID' \
             DEPLOY_RUN_ATTEMPT='$GITHUB_RUN_ATTEMPT' \
             OPSHUB_ENV_FILE='$OPSHUB_ENV_FILE' \
             OPSHUB_SSD_ROOT='/srv/opshub' \
             DOWNLOADS_DIR='/srv/opshub/downloads' \
             WEB_DIR='/srv/opshub/web' \
             OPSHUB_TXN_STATIC_ONLY=true \
             bash -s" <<'REMOTE'
          set -Eeuo pipefail
          source "$TMP_DIR/release-transaction.sh"
          export OPSHUB_SUDO=sudo
          TXN_INPUT_DIR="$TMP_DIR"
          if [ ! -d "$CURRENT_DIR/deploy/home-server" ]; then
            echo "Current deploy directory is missing: $CURRENT_DIR/deploy/home-server" >&2
            exit 1
          fi
          docker run --rm \
            --env-file "$OPSHUB_ENV_FILE" \
            -v "$TMP_DIR/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile < /dev/null
          opshub_txn_begin
          rollback_static() {
            local status="$1"
            local shared_restored=false
            local static_restored=false
            local caddy_restored=false
            trap - ERR
            echo "Static-only publication failed with status $status" >&2
            if opshub_txn_restore_shared; then
              shared_restored=true
            fi
            if opshub_txn_restore_static_current; then
              static_restored=true
            fi
            if [ "$shared_restored" = true ] && [ "$static_restored" = true ]; then
              cd "$CURRENT_DIR"
              export OPSHUB_ENV_FILE
              compose=(docker compose --env-file "$OPSHUB_ENV_FILE" -f deploy/home-server/docker-compose.home.yml)
              compose_cmd() { "${compose[@]}" "$@" < /dev/null; }
              if compose_cmd up -d --no-deps --force-recreate caddy; then
                caddy_restored=true
              fi
            fi
            if [ "$shared_restored" = true ] && [ "$static_restored" = true ] && [ "$caddy_restored" = true ]; then
              echo 'Static rollback is healthy; checkpoint retained because publication failed.' >&2
            else
              echo 'Static-only rollback incomplete; evidence retained.' >&2
            fi
            exit "$status"
          }
          trap 'rollback_static $?' ERR
          opshub_txn_promote_static
          cd "$CURRENT_DIR"
          export OPSHUB_ENV_FILE
          compose=(docker compose --env-file "$OPSHUB_ENV_FILE" -f deploy/home-server/docker-compose.home.yml)
          compose_cmd() {
            "${compose[@]}" "$@" < /dev/null
          }

          # The Caddyfile is a file bind mount. Recreate Caddy so replacing
          # the host file also refreshes the container's mounted inode.
          compose_cmd up -d --no-deps --force-recreate caddy
          if ! compose_cmd exec -T caddy caddy reload --config /etc/caddy/Caddyfile; then
            compose_cmd restart caddy
          fi
          compose_cmd ps caddy
          trap - ERR
          REMOTE

      - name: Verify static download deploy
        shell: bash
        run: |
          set -euo pipefail
          retry_curl() {
            local url="$1"
            local attempt
            for attempt in {1..12}; do
              if curl -fsS "$url"; then
                return 0
              fi
              sleep 5
            done
            curl -fsS "$url"
          }

          retry_curl "${OPSHUB_PUBLIC_BASE_URL}/download" >/dev/null
          retry_curl "${OPSHUB_PUBLIC_BASE_URL}/help" >/dev/null
          help_json="$(retry_curl "${OPSHUB_API_BASE_URL}/help-content/public")"
          manifest_json="$(retry_curl "${OPSHUB_PUBLIC_BASE_URL}/downloads/latest.json")"
          android_after="$(retry_curl "${OPSHUB_API_BASE_URL}/app-version?platform=android")"
          windows_after="$(retry_curl "${OPSHUB_API_BASE_URL}/app-version?platform=windows")"
          node -e "
            const fs = require('node:fs');
            const help = JSON.parse(process.argv[1]);
            const manifest = JSON.parse(process.argv[2]);
            const androidBefore = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
            const windowsBefore = JSON.parse(fs.readFileSync(process.argv[4], 'utf8'));
            const androidAfter = JSON.parse(process.argv[5]);
            const windowsAfter = JSON.parse(process.argv[6]);
            if (!Array.isArray(help.pages) || help.pages.length === 0) {
              throw new Error('Public help runtime snapshot is empty after static-only deploy');
            }
            if (JSON.stringify(androidBefore) !== JSON.stringify(androidAfter)) {
              throw new Error('Android app-version changed during static-only deploy');
            }
            if (JSON.stringify(windowsBefore) !== JSON.stringify(windowsAfter)) {
              throw new Error('Windows app-version changed during static-only deploy');
            }
            if (manifest.version !== androidAfter.latestVersion || manifest.build !== androidAfter.latestBuild) {
              throw new Error('Download manifest does not match live Android metadata');
            }
            const required = ['apk', 'windowsInstaller', 'windowsZip', 'windowsChecksum'];
            for (const key of required) {
              const file = manifest.files?.[key];
              if (!file?.url || !file?.fileName || !Number.isInteger(file.sizeBytes) || file.sizeBytes <= 0) {
                throw new Error('Download manifest file entry is invalid: ' + key);
              }
            }
          " "$help_json" "$manifest_json" dist/downloads/android-before.json dist/downloads/windows-before.json "$android_after" "$windows_after"
          node -e "
            const manifest = JSON.parse(process.argv[1]);
            for (const file of Object.values(manifest.files)) console.log(file.url);
          " "$manifest_json" | while IFS= read -r url; do
            curl -fIs "$url" >/dev/null
          done

      - name: Roll back static-only publication after failed verification
        if: ${{ (failure() || cancelled()) && steps.deploy_static.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          current_dir="${OPSHUB_REMOTE_APP_DIR}/current"
          tmp_dir="${OPSHUB_REMOTE_APP_DIR}/tmp/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-static"
          ssh opshub-vps \
            "REMOTE_RELEASE_DIR='$current_dir' CURRENT_DIR='$current_dir' TMP_DIR='$tmp_dir' OPSHUB_REMOTE_APP_DIR='${OPSHUB_REMOTE_APP_DIR}' DEPLOY_RUN_ID='$GITHUB_RUN_ID' DEPLOY_RUN_ATTEMPT='$GITHUB_RUN_ATTEMPT' OPSHUB_ENV_FILE='$OPSHUB_ENV_FILE' OPSHUB_SSD_ROOT='/srv/opshub' DOWNLOADS_DIR='/srv/opshub/downloads' WEB_DIR='/srv/opshub/web' OPSHUB_TXN_STATIC_ONLY=true bash -s" <<'REMOTE'
          set -Eeuo pipefail
          source "$TMP_DIR/release-transaction.sh"
          export OPSHUB_SUDO=sudo
          opshub_txn_load
          opshub_txn_require_promoted
          current_real="$(readlink -f "$CURRENT_DIR" || true)"
          [ "$current_real" = "$(opshub_txn_candidate_release)" ] || {
            echo 'Static rollback candidate no longer matches checkpoint; refusing publication change.' >&2
            exit 1
          }
          opshub_txn_restore_shared
          opshub_txn_restore_static_current
          cd "$CURRENT_DIR"
          export OPSHUB_ENV_FILE
          compose=(docker compose --env-file "$OPSHUB_ENV_FILE" -f deploy/home-server/docker-compose.home.yml)
          compose_cmd() { "${compose[@]}" "$@" < /dev/null; }
          compose_cmd up -d --no-deps --force-recreate caddy
          echo 'Static-only publication rolled back; checkpoint retained because public verification failed.' >&2
          REMOTE

      - name: Finalize successful static-only publication checkpoint
        if: ${{ success() && steps.deploy_static.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          current_dir="${OPSHUB_REMOTE_APP_DIR}/current"
          tmp_dir="${OPSHUB_REMOTE_APP_DIR}/tmp/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-static"
          ssh opshub-vps \
            "REMOTE_RELEASE_DIR='$current_dir' CURRENT_DIR='$current_dir' TMP_DIR='$tmp_dir' OPSHUB_REMOTE_APP_DIR='${OPSHUB_REMOTE_APP_DIR}' DEPLOY_RUN_ID='$GITHUB_RUN_ID' DEPLOY_RUN_ATTEMPT='$GITHUB_RUN_ATTEMPT' OPSHUB_ENV_FILE='$OPSHUB_ENV_FILE' OPSHUB_SSD_ROOT='/srv/opshub' OPSHUB_TXN_STATIC_ONLY=true bash -s" <<'REMOTE'
          set -Eeuo pipefail
          source "$TMP_DIR/release-transaction.sh"
          export OPSHUB_SUDO=sudo
          opshub_txn_load
          opshub_txn_require_promoted
          current_real="$(readlink -f "$CURRENT_DIR" || true)"
          [ "$current_real" = "$(opshub_txn_candidate_release)" ] || {
            echo 'Static checkpoint no longer matches current runtime; refusing cleanup.' >&2
            exit 1
          }
          case "$TMP_DIR" in "$OPSHUB_REMOTE_APP_DIR"/tmp/*) rm -rf -- "$TMP_DIR" ;; *) exit 1 ;; esac
          opshub_txn_cleanup
          echo 'Static-only publication checkpoint finalized after verification.'
          REMOTE
