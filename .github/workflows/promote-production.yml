name: Promote OpsHub Production
# Dispatch this workflow from ref `main`. The approved source remains the exact
# `staging_sha` input; the workflow fetches and verifies live origin/staging.
run-name: Promote origin/staging to main from workflow ref ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      staging_sha:
        description: Exact 40-character origin/staging SHA already deployed and QA-approved.
        required: true
        type: string
      qa_confirmation:
        description: Type QA-APPROVED after Đại Ca confirms staging QA.
        required: true
        type: string
      release_confirmation:
        description: Type PROMOTE ORIGIN/STAGING TO MAIN to authorize this promotion.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-promotion
  cancel-in-progress: false

jobs:
  production_parity:
    name: Production parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate staging SHA format
        shell: bash
        env:
          EXPECTED_STAGING_SHA: ${{ inputs.staging_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_STAGING_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo 'staging_sha must be an exact 40-character commit SHA.' >&2
            exit 1
          }

      - name: Check out exact staging candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: ${{ inputs.staging_sha }}

      - name: Verify and rehearse exact staging candidate
        shell: bash
        env:
          EXPECTED_STAGING_SHA: ${{ inputs.staging_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/staging:refs/remotes/origin/staging
          actual_staging_sha="$(git rev-parse refs/remotes/origin/staging)"
          checked_out_sha="$(git rev-parse HEAD)"
          if [ "$actual_staging_sha" != "$EXPECTED_STAGING_SHA" ] || \
             [ "$checked_out_sha" != "$EXPECTED_STAGING_SHA" ]; then
            echo 'Staging candidate changed or checkout is stale.' >&2
            exit 1
          fi
          bash tests/release/test-production-cutover-transaction.sh

  promote:
    name: Fast-forward origin/staging to main
    runs-on: ubuntu-latest
    needs: production_parity
    environment: production
    steps:
      - name: Validate explicit release confirmation
        shell: bash
        env:
          QA_CONFIRMATION: ${{ inputs.qa_confirmation }}
          RELEASE_CONFIRMATION: ${{ inputs.release_confirmation }}
        run: |
          set -euo pipefail
          if [ "$QA_CONFIRMATION" != 'QA-APPROVED' ]; then
            echo 'qa_confirmation must be exactly QA-APPROVED.' >&2
            exit 1
          fi
          if [ "$RELEASE_CONFIRMATION" != 'PROMOTE ORIGIN/STAGING TO MAIN' ]; then
            echo 'release_confirmation does not authorize origin/staging -> main.' >&2
            exit 1
          fi

      - name: Connect Tailscale for read-only production readiness
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.OPSHUB_VPS_HOST }}
          version: latest

      - name: Configure production SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.OPSHUB_VPS_HOST }}
          VPS_PORT: ${{ secrets.OPSHUB_VPS_PORT || '22' }}
          VPS_USER: ${{ secrets.OPSHUB_VPS_USER || 'ubuntu' }}
          VPS_SSH_KEY: ${{ secrets.OPSHUB_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/opshub_release_readiness_key
          chmod 600 ~/.ssh/opshub_release_readiness_key
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts
          {
            echo 'Host opshub-vps'
            echo "  HostName $VPS_HOST"
            echo "  Port $VPS_PORT"
            echo "  User $VPS_USER"
            echo '  IdentityFile ~/.ssh/opshub_release_readiness_key'
            echo '  IdentitiesOnly yes'
          } >> ~/.ssh/config

      - name: Verify current production readiness without mutation
        shell: bash
        run: |
          set -euo pipefail
          ssh opshub-vps 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          app_dir='/home/ubuntu/phongvu-opshub'
          current="$app_dir/current"
          live_env='/srv/opshub/env'
          downloads='/srv/opshub/downloads'
          web='/srv/opshub/web'
          rollback_dir='/srv/opshub/rollback'
          identity="$rollback_dir/current-runtime-identity.json"

          sudo -n true
          current_real="$(readlink -f "$current" || true)"
          case "$current_real" in
            "$app_dir"/releases/*) ;;
            *) echo 'Production readiness: current release pointer is outside releases.' >&2; exit 1 ;;
          esac
          [ -s "$current_real/release-manifest.json" ] || {
            echo 'Production readiness: current release manifest is missing.' >&2
            exit 1
          }
          [ "$(sudo stat -c '%U:%a' "$rollback_dir")" = 'root:700' ] || {
            echo 'Production readiness: rollback directory owner/mode is not root:0700.' >&2
            exit 1
          }
          [ "$(sudo stat -c '%U:%a' "$identity")" = 'root:600' ] || {
            echo 'Production readiness: retained identity owner/mode is not root:0600.' >&2
            exit 1
          }
          sudo python3 - "$identity" "$current_real/release-manifest.json" <<'PY'
          import json, pathlib, sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          manifest = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding='utf-8'))
          expected = {
              'sourceCommit', 'envSha256', 'apiImageId', 'realtimeImageId',
              'caddySha256', 'webSha256', 'manifestSha256', 'helpSha256',
          }
          if set(payload) != expected or not all(isinstance(payload[key], str) and payload[key] for key in expected):
              raise SystemExit('Production readiness: retained identity schema is invalid')
          if payload['sourceCommit'] != manifest.get('sourceCommit'):
              raise SystemExit('Production readiness: retained identity is not bound to the current release')
          PY
          OPSHUB_SUDO=sudo \
            bash "$current_real/deploy/home-server/verify-production-baseline.sh" \
              "$current_real" "$live_env" "$live_env" "$current" "$downloads" "$web"
          sudo cloudflared --config /etc/cloudflared/config.yml tunnel ingress validate
          sudo systemctl is-active --quiet cloudflared
          curl -fsS -H 'Host: phongvu.work' -H 'X-Forwarded-Proto: https' \
            'http://127.0.0.1:8090/health' >/dev/null
          curl -fsS -H 'Host: api.phongvu.work' -H 'X-Forwarded-Proto: https' \
            'http://127.0.0.1:8090/v1/health' >/dev/null
          echo 'Production readiness PASS: runtime, retained-record authority, Tunnel and direct origin are coherent.'
          REMOTE

      - name: Mint least-privilege release token
        id: release-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.OPSHUB_RELEASE_APP_ID }}
          private-key: ${{ secrets.OPSHUB_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: read
          permission-contents: write
          permission-statuses: read

      - name: Check out release guard
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.release-token.outputs.token }}

      - name: Verify and promote staging SHA
        shell: bash
        env:
          EXPECTED_STAGING_SHA: ${{ inputs.staging_sha }}
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        run: |
          set -euo pipefail
          node scripts/validate-ops39-local-boundary.mjs
          node scripts/promote-production.mjs \
            --expected-sha "$EXPECTED_STAGING_SHA" \
            --authorized-by "$GITHUB_ACTOR" \
            --ci-confirmed \
            --qa-confirmed \
            --release-window-locked \
            --verify-github-ci \
            --execute
